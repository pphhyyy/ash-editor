name: ASH
options:
  bundleIdPrefix: app.ash
  deploymentTarget:
    macOS: '14.0'
packages:
  MarkdownUI:
    path: Vendor/swift-markdown-ui
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
targets:
  ASH:
    type: application
    platform: macOS
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ASH
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleIconFile: ASHHanddrawn.icns
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHighResolutionCapable: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.ash.editor.document-tab
            UTTypeDescription: ASH document tab
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: app.ash.editor.workspace-file
            UTTypeDescription: ASH workspace file
            UTTypeConformsTo: [public.data]
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ash.editor
        PRODUCT_NAME: ASH
        MARKETING_VERSION: 2.0.5
        CURRENT_PROJECT_VERSION: 8
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: ASH
        INFOPLIST_KEY_CFBundleIconFile: ASHHanddrawn
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ASH.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
